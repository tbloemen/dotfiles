# Catppuccin Latte — light mode palette for dunst.
# Copied to dunstrc.d/99-colors.conf by ~/.local/share/darkman/dunst.sh
# whenever darkman switches to light mode; the drop-in overrides dunstrc.
# separator_color = "frame" in dunstrc, so it follows frame_color.

[global]
    frame_color = "#ccd0da"

[urgency_low]
    background = "#eff1f5"
    foreground = "#4c4f69"
    highlight = "#8839ef"

[urgency_normal]
    background = "#eff1f5"
    foreground = "#4c4f69"
    highlight = "#8839ef"

[urgency_critical]
    background = "#eff1f5"
    foreground = "#4c4f69"
    highlight = "#8839ef"
