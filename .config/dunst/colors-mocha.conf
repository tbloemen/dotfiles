# Catppuccin Mocha — dark mode palette for dunst.
# Copied to dunstrc.d/99-colors.conf by ~/.local/share/darkman/dunst.sh
# whenever darkman switches to dark mode; the drop-in overrides dunstrc.
# separator_color = "frame" in dunstrc, so it follows frame_color.

[global]
    frame_color = "#313244"

[urgency_low]
    background = "#1e1e2e"
    foreground = "#cdd6f4"
    highlight = "#cba6f7"

[urgency_normal]
    background = "#1e1e2e"
    foreground = "#cdd6f4"
    highlight = "#cba6f7"

[urgency_critical]
    background = "#1e1e2e"
    foreground = "#cdd6f4"
    highlight = "#cba6f7"
